plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.resturant.management'
version = '0.0.1-SNAPSHOT'
description = 'Restaurant Management System — REST API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// --- web / persistence -------------------------------------------------
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// --- security ----------------------------------------------------------
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// --- mail (OTP / password reset) ---------------------------------------
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// --- database + migrations ---------------------------------------------
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// In-memory DB for the `dev` profile only, so the app boots with no external
	// dependency. Real work runs on PostgreSQL — see application-dev.yml.
	runtimeOnly 'com.h2database:h2'

	// --- api docs ----------------------------------------------------------
	// 2.8.x is the first line compatible with Spring Framework 6.2 (Boot 3.5).
	// On 2.6.0, /v3/api-docs threw NoSuchMethodError on
	// ControllerAdviceBean.<init>(Object) as soon as a @RestControllerAdvice existed.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	// --- dev ---------------------------------------------------------------
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- test --------------------------------------------------------------
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Real PostgreSQL for the `postgres` test task — needs a Docker daemon.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
	// The profile is set here, not with @ActiveProfiles on each test class.
	// A hardcoded @ActiveProfiles overrides this property, which silently made
	// `postgresTest` run the whole suite on H2 while reporting success.
	systemProperty 'spring.profiles.active', 'dev'
}

/**
 * Runs the same suite against a real PostgreSQL 16 container.
 *
 *   ./gradlew postgresTest        (requires a running Docker daemon)
 *
 * H2 in PostgreSQL mode is close, but not identical — this is what proves the
 * Flyway migrations and every JPQL query actually work on the target database.
 */
tasks.register('postgresTest', Test) {
	description = 'Runs the test suite against PostgreSQL in Testcontainers (needs Docker).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'spring.profiles.active', 'testpg'
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}
