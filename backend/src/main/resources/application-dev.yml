# ---------------------------------------------------------------------------
# `dev` profile — in-memory H2, no external services required.
#
#   ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# Purpose: boot the app and hit /api/health without installing anything.
# NOT the profile to build features on — Flyway is disabled here and Hibernate
# generates the schema, so it will drift from the real PostgreSQL schema.
# Use the default profile (PostgreSQL + Flyway) from milestone 2 onward.
# ---------------------------------------------------------------------------

spring:
  datasource:
    url: jdbc:h2:mem:rms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    jwt:
      # Throwaway value so the context starts. Never used outside `dev`.
      secret-key: ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItYW55LXJlYWwtZW52aXJvbm1lbnQtMDAwMQ==
