spring:
  application:
    name: rms-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant_management_system}
    username: ${DB_USERNAME:rms}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Phnom_Penh

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  jackson:
    default-property-inclusion: non_null

  mvc:
    # Raise NoHandlerFoundException so an unknown path reaches the exception
    # handler and returns a 404 in the ApiResponse shape, instead of Spring's
    # default error page.
    throw-exception-if-no-handler-found: true

  web:
    resources:
      # This is an API; it serves no static files. Without this, an unknown path
      # is treated as a missing resource rather than a missing endpoint.
      add-mappings: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-stacktrace: never
    include-binding-errors: never
  # Cap request bodies: this API never legitimately receives a large one, and an
  # uncapped endpoint is a cheap denial-of-service target.
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ---------------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------------
app:
  cors:
    # Next.js dev server. Comma-separated for multiple origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  security:
    jwt:
      # MUST be supplied via env or application-local.yml. No default on purpose —
      # a committed default secret is how the NIEI-Y4 repo leaked its signing key.
      secret-key: ${JWT_SECRET:}
      expiration: 3600000            # 1 hour
      refresh-token:
        expiration: 86400000         # 24 hours

    cookie:
      # The refresh cookie is httpOnly always; `secure` additionally requires
      # HTTPS. Local dev runs on plain http, so it defaults to false here and
      # MUST be true anywhere the app is actually deployed.
      secure: ${COOKIE_SECURE:false}

    # Prefix for the generated 10-character UserInfm.bizKey.
    default-biz-key: ${BIZ_KEY_PREFIX:RMS}

    # Caps on the endpoints reachable without a token. Account lockout stops
    # brute force against one account; these stop the attacks it cannot see —
    # credential stuffing across many accounts, locking a known user out on
    # purpose, and guessing a six-digit OTP.
    #
    # Counted per caller in memory, so per instance: behind a load balancer
    # each instance allows the full limit.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}

      # X-Forwarded-For is caller supplied. Trusting it with nothing upstream
      # rewriting it means an attacker sends a new value per request and is
      # never limited, so it stays off until there really is a proxy in front.
      trust-forwarded-for: ${RATE_LIMIT_TRUST_XFF:false}

      # Generous next to real use — a cashier signing in mistypes twice, not
      # ten times a minute — and far below what guessing needs.
      login:
        limit: 10
        window: 1m
      forgot-password:
        limit: 5
        window: 10m
      # Tightest of the four: a six-digit code is a million guesses, which is
      # minutes of traffic if nothing throttles it.
      verify-otp:
        limit: 10
        window: 10m
      register:
        limit: 5
        window: 1h

  currency:
    base: USD
    khr-rate: 4100

logging:
  level:
    com.resturant.management.rms: DEBUG
    org.hibernate.SQL: INFO
