spring:
  application:
    name: rms-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rms}
    username: ${DB_USERNAME:rms}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Phnom_Penh

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ---------------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------------
app:
  cors:
    # Next.js dev server. Comma-separated for multiple origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  security:
    jwt:
      # MUST be supplied via env or application-local.yml. No default on purpose —
      # a committed default secret is how the NIEI-Y4 repo leaked its signing key.
      secret-key: ${JWT_SECRET:}
      expiration: 3600000            # 1 hour
      refresh-token:
        expiration: 86400000         # 24 hours

    cookie:
      # The refresh cookie is httpOnly always; `secure` additionally requires
      # HTTPS. Local dev runs on plain http, so it defaults to false here and
      # MUST be true anywhere the app is actually deployed.
      secure: ${COOKIE_SECURE:false}

    # Prefix for the generated 10-character UserInfm.bizKey.
    default-biz-key: ${BIZ_KEY_PREFIX:RMS}

  currency:
    base: USD
    khr-rate: 4100

logging:
  level:
    com.resturant.management.rms: DEBUG
    org.hibernate.SQL: INFO
