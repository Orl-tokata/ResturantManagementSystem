# Every user-facing message the API can return, in English.
#
# IMPORTANT — quoting. The MessageSource is configured with
# alwaysUseMessageFormat=true, so every value here is a java.text.MessageFormat
# pattern, whether or not it takes arguments. In MessageFormat a single quote
# opens a quoted section: 'text' renders as text and, worse, '{0}' renders as
# the literal {0} instead of substituting. So every apostrophe must be doubled.
# Write ''{0}'' to wrap a value in quotes, and don''t for the contraction.
#
# The rule is uniform on purpose. With alwaysUseMessageFormat=false a message
# would be formatted only when it happens to have arguments, so the same
# apostrophe would be correct in one line and wrong in the next.
#
# MessagesTest renders every key in this file and asserts nothing comes back
# with a stray brace, which is what a mis-quoted pattern leaves behind.

