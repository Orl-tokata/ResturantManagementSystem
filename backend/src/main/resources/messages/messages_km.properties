# Every user-facing message the API can return, in Khmer.
#
# Same quoting rule as messages_en.properties: every value is a MessageFormat
# pattern, so an apostrophe must be doubled. Khmer text rarely needs one, but
# the ''{0}'' wrappers still do.
#
# The file is UTF-8 and the MessageSource is configured to read it as UTF-8.
# Java's default for .properties is ISO-8859-1, which would turn every Khmer
# character into mojibake, so that setting is not optional here.

